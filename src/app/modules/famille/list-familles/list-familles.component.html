<div id="" class="d-flex flex-column justify-content-around">
  <div class="title" id="top1">
      <app-entete class="title"></app-entete>
  </div>
  <div class="card container-fluid" id="top">
      <div class='card-hearder pt-3' >
          <div class="d-flex align-items-center justify-content-end tableTools">
              <div class="form-inline mr-2">
                  <form class="example-form-entete">
                    <input placeholder="{{'patient.search-bar' | translate}}" type="text" matInput aria-label="Rechercher" [formControl]="myControl" [matAutocomplete]="auto">
                    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
                      <mat-option *ngFor="let option of filteredOptions" [value]="option" (onSelectionChange)="rechercherListingFamille(option)">
                        {{option.libelle}}
                      </mat-option>
                    </mat-autocomplete>
                  </form>
              </div>
              <div role="button" id="addItemBotton" routerLink="../famille-nouvelle">
                  <span title="Ajouter Une Nouvelle Famille">
                      <i class="fa fa-plus" aria-hidden="true"></i>
                  </span>
              </div>
          </div>
      </div>
      <div class="card-body p-0" id="tableBlock">
          <div class="table-responsive w-100">
              <table class='table table-sm table-centered table-striped table-bordered w-100' mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

                <!-- Libellé Column -->
                <ng-container matColumnDef="libelle">
                  <th class="containHead" mat-header-cell *matHeaderCellDef mat-sort-header>  {{"famille.table1.title1" | translate}} </th>
                  <td class="containCell" mat-cell *matCellDef="let element"> {{element.libelle}} </td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                  <th class="containHead" mat-header-cell *matHeaderCellDef mat-sort-header>{{"famille.table1.title2" | translate}} </th>
                  <td class="containCell" mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container>

                <!-- Etat Column -->
                <ng-container matColumnDef="etat">
                  <th class="containHead" mat-header-cell *matHeaderCellDef mat-sort-header>{{"famille.table1.title3" | translate}}</th>
                  <td class="containCell" mat-cell *matCellDef="let element"> {{element.etat}} </td>
                </ng-container>

                <!-- action Column -->
                <ng-container matColumnDef="actions">
                  <th class="text-dark containHead" mat-header-cell *matHeaderCellDef> {{"famille.table1.title4" | translate}}</th>
                  <td class="text-dark containCell" mat-cell *matCellDef="let element">
                    <div id="actions">
                        <button mat-button [matMenuTriggerFor]="menu"><span>...</span></button>
                        <mat-menu #menu="matMenu">
                            <ng-container *ngFor="let action of actions">
                                <button mat-menu-item *ngIf="action.bouton == 'false'" [routerLink]="[action.lien,element.id]">
                                    <span>{{action.nom}}</span>
                                </button>
                            </ng-container>
                        </mat-menu>
                    </div>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              
            </div>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                             showFirstLastButtons
                             aria-label="Select page of periodic elements">
              </mat-paginator>

      </div>

      <!-- Modal -->
      <div class="modal fade" id="modelTicket" tabindex="-1" role="dialog" aria-labelledby="modelTitleId" aria-hidden="true">
          <app-new-ticket></app-new-ticket>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="modelTicket" tabindex="-1" role="dialog" aria-labelledby="modelTitleId" aria-hidden="true">
          <app-new-ticket></app-new-ticket>
      </div>
  </div>
</div>
