<div id="mainBlock" class="bg-light d-flex flex-wrap">
    <div>
        <form class="w-100" id="mainBlockDockEtat">
            <div class="form-group mt-5">
                <div class='card-hearder'>
                    <h2 class="modal-title">{{'etape.title4' | translate}}</h2>
                </div>
                <div class="newAttSection">
                    <div class="searchBlock">
                        <form [formGroup]="formeParEtapes" *ngIf="formeParEtapes" class="example-form-entete">
                            <div class="etapeInput">
                                <label>{{"parcours.table.title2" | translate}}</label>
                                <input placeholder="{{'patient.search-bar' | translate}}" type="text" class="form-control inputMat" matInput aria-label="Rechercher" [formControl]="etapeControl" [matAutocomplete]="auto">
                                <mat-autocomplete class="blockAutocomplate" #auto="matAutocomplete" [displayWith]="displayFn">
                                    <mat-option class="options" *ngFor="let option of filteredOptions" [value]="option" (click)="rechercherListingEtape(option); reinitialliseRessourceControl()">
                                        {{option.libelle}}
                                    </mat-option>
                                </mat-autocomplete>
                            </div>
                        </form>
                        <div *ngIf="selected && etapeExiste" class="texteErreur">
                            <p>{{'doc-etats.form.text5' | translate}}</p>
                        </div>
                    </div>
    
                    <!-- tableau listing des etapes du parcours -->
    
                    <div class="card-body p-0 tableBlock" id="tableBlock">
                        <div class='table-responsive w-100'>
                            <table class='table table-sm table-centered table-striped table-bordered w-100' mat-table [dataSource]="dataSourceParEtapes">
    
                                <!-- libelle Column -->
                                <ng-container matColumnDef="libelle">
                                    <th class="text-dark containHead" mat-header-cell *matHeaderCellDef> {{'preconisation.table.title1' | translate}} </th>
                                    <td class="text-dark containCell" mat-cell *matCellDef="let element"> {{element.libelle}} </td>
                                </ng-container>
    
                                <!-- validation Column -->
                                <!-- <ng-container matColumnDef="validation">
                                    <th class="text-dark containHead" mat-header-cell *matHeaderCellDef> {{'doc-etats.form.text6' | translate}} </th>
                                    <td class="text-dark containCell" mat-cell *matCellDef="let element">{{element.validation?.libelle}}</td>
                                </ng-container> -->
    
                                <!-- EtapePrecedant Column -->
                                <ng-container matColumnDef="EtapePrecedant">
                                    <th class="text-dark containHead" mat-header-cell *matHeaderCellDef> {{'etape.title2' | translate}}</th>
                                    <td class="text-dark containCell choixCell champsSelect" mat-cell *matCellDef="let element, let i = index">
                                        <div class="matSelectElement selectInputTab">
                                            <mat-select [disabled]="i == 0" [(ngModel)]="element.etatPrecedant" [ngModelOptions]="{standalone: true}" multiple>
                                                <mat-option *ngFor="let etape of effaceEtapeCourrant(element)" (click)="ngAfterViewInit()" [value]="etape">{{etape.libelle}}</mat-option>
                                            </mat-select>
                                        </div>
                                        <div class="coverFull" *ngIf="i == 0">
                                            <span><i class="fa fa-times-circle" aria-hidden="true"></i></span>
                                        </div>
                                    </td>
                                </ng-container>
    
                                <!-- Actions column -->
                                <ng-container matColumnDef="actions">
                                    <th class="text-dark containHead" mat-header-cell *matHeaderCellDef> {{"patient.table.title8" | translate}} </th>
                                    <td class="text-dark containCell" mat-cell *matCellDef="let element; let i = index">
                                        <div class="actions">
                                            <button class="btn" [value]="element.id" title="{{'lists.button3' | translate}}" (click)="retirerSelectionEtape(i)">
                                                <i class="fa fa-trash text-danger" aria-hidden="true"></i>
                                            </button>
                                        </div>
                                    </td>
                                </ng-container>
                                <tr mat-header-row *matHeaderRowDef="displayedParEtapesColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedParEtapesColumns;"></tr>
                            </table>
    
                            <mat-paginator [pageSizeOptions]="[2, 5, 10, 20]"
                                           showFirstLastButtons
                                           aria-label="Select page of periodic elements">
                            </mat-paginator>
                        </div>
                        <div class="actionButton valBtn mt-2">
                            <button class="btn retour" [mat-dialog-close] title="{{'lists.button2' | translate}}">
                                <i class="fa fa-undo" aria-hidden="true"></i>
                            </button>
                            <button mat-button [mat-dialog-close] cdkFocusInitial class="btn btnValidation" title="{{'lists.button6' | translate}}" (click)="onSave()">
                                <i class="fa fa-check" aria-hidden="true"></i>
                            </button>                       
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="d-flex align-items-center" #mermaidDivEtapesPar></div>
</div>
